<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Fondo con degradado CSS</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(90deg, #3a7bd5 0%, #00d2ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            color: white;
        }
        h1 {
            background: rgba(0,0,0,0.25);
            padding: 20px 30px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1>Degradado CSS con Linear Gradient</h1>
</body>
</html>
