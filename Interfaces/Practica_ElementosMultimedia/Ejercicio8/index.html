<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diseño Adaptativo con &lt;picture&gt; - HTML5</title>
  <style>
    picture img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 2rem;
    }
  </style>
</head>
<body>
  <h1>Ejemplo con el elemento &lt;picture&gt; (HTML5)</h1>
  <p>La imagen mostrada se adapta según el tamaño del dispositivo.</p>

  <picture>
    <!-- Imagen para dispositivos móviles -->
    <source media="(max-width: 767px)" srcset="imagen-480x320.png">
    <!-- Imagen predeterminada para escritorio -->
    <img src="imagen-1920x1080.png" alt="Imagen adaptable con el elemento picture">
  </picture>
</body>
</html>
