<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva y Pago</title>
</head>

<body>

    <h1>Gestión de Reservas de Hotel</h1>
    <fieldset>
        <legend>1. Datos de la Reserva</legend>

        <label for="nombreReserva">Nombre:</label>
        <input type="text" id="nombreReserva">
        <br/>
        <label for="telefono">Teléfono:</label>
        <input type="text" id="telefono">
        <br/>
        <label for="emailReserva">Email:</label>
        <input type="email" id="emailReserva">
        <br/>
        <label for="codigoReserva">Código de Reserva:</label>
        <input type="text" id="codigoReserva">
        <br/>
        <label for="fechaLlegada">Fecha de Llegada:</label>
        <input type="date" id="fechaLlegada">

        <br/><br/>
        <button id="btnConfirmar">Confirmar Reserva</button>
        <br/><br/>
        <div id="msgReserva"></div>
    </fieldset>

    <fieldset>
        <legend>2. Datos de Pago</legend>

        <label for="numTarjeta">Número de Tarjeta:</label>
        <input type="text" id="numTarjeta">
        <br/>
        <label for="cvv">Código CVV:</label>
        <input type="text" id="cvv">
        <br/>
        <label for="titularTarjeta">Titular de la Tarjeta:</label>
        <input type="text" id="titularTarjeta">
        <br/>
        <button id="btnPagar">Pagar</button>
        <br/><br/>
        <div id="msgPago"></div>

        <script src="code.js"></script>
    </fieldset>
</body>

</html>
