<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Ejercicio 8</title>
        <script src="ejercicios.js"></script>
    </head>
    <body>
        <script>
            let color = prompt("Elige un color(rojo, azul, verde)")
            switch(color){
                case("rojo"):
                    alert("El color de la sangre")
                case("azul"):
                    alert("El color del mar")
                case("verde"):
                    alert("El color de los arboles")
                default:
                    alert("ERROR")
            }
        </script>
    </body>
</html>
