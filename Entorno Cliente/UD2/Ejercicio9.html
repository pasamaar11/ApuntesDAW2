<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Ejercicio 9</title>
        <script src="ejercicios.js"></script>
    </head>
    <body>
        <script>
            let edad = prompt("Dime edad")
            if(edad < 18)
                alert("Vaya crio")
            else if(edad > 18 && edad < 68)
                alert("Eres un adulto")
            else if (edad > 68 && edad < 120)
                alert("Estás jubilado")
            else
                alert("Eres un cadaver")
        </script>
    </body>
</html>
