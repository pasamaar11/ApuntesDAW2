<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Ejercicio 11</title>
        <script src="ejercicios.js"></script>
    </head>
    <body>
        <script>
            let numero = prompt("Dime un número")
            let resultado
            for(let i = 1;i <= 10;i++){
                resultado = numero * i
                document.write(numero + " x " + i + " = " + resultado + "<br/>")
            }
        </script>
    </body>
</html>
