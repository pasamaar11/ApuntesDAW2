<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Formulario Nivel de Estudios</title>
    </head>
    <body>
        <h2>Selecciona tu nivel de estudios:</h2>
        <form action="#" id="form-estudios">
            <input type="radio" id="eso" name="estudios" value="ESO">
            <label for="eso">ESO</label><br>

            <input type="radio" id="bachiller" name="estudios" value="Bachiller">
            <label for="bachiller">Bachiller</label><br>

            <input type="radio" id="fp" name="estudios" value="FP">
            <label for="fp">FP</label><br><br>

            <input type="submit" value="Enviar">
        </form>
    </body>
</html>
